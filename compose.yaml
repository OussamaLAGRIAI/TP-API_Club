# compose.yaml — TP 6, corrigé. Aucune valeur secrète ici : tout vient de .env.
name: api-club

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - db_data:/var/lib/postgresql/data      # volume nommé : survit à down
    networks:
      - backend                               # aucun port publié
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      retries: 15

  api:
    build: .
    image: api-club:1.0.0
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:

networks:
  frontend:
  backend:
    internal: true                            # la base n'a rien à faire sur Internet
